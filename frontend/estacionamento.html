<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estacionamento - PUC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header estacionamento-header">
    <button class="voltar" onclick="window.location.href='index.html'">← Voltar</button>
    <img src="imagem/puc.png" alt="Logo PUC" class="logo-header">
  </div>

  <div class="estacionamento-imagem">
    <img src="imagem/drone.jpg" alt="Imagem Estacionamento">
  </div>

  <div class="estacionamento-lista">
    <div class="vaga-card" onclick="window.location.href='visualizar-vagas.html'" style="cursor: pointer;">
      <span>H15</span>
      <span>Vagas disponíveis: 12</span>
    </div>
    <div class="vaga-card" onclick="window.location.href='visualizar-vagas.html'" style="cursor: pointer;">
      <span>Mescla</span>
      <span>Vagas disponíveis: 26</span>
    </div>
    <div class="vaga-card" onclick="window.location.href='visualizar-vagas.html'" style="cursor: pointer;">
      <span>H07</span>
      <span>Vagas disponíveis: 02</span>
    </div>
    <div class="vaga-card" onclick="window.location.href='visualizar-vagas.html'" style="cursor: pointer;">
      <span>H00</span>
      <span>Vagas disponíveis: 06</span>
    </div>
  </div>

  <footer class="rodape">
    <p>v0.0.0.1</p>
  </footer>

</body>
</html>
