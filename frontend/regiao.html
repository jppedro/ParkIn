<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Região - ParkIn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="header estacionamento-header">
    <button class="voltar" onclick="window.location.href='admin.html'">← Voltar</button>
    <h2 id="titulo-setor">Setor</h2>
    <img src="imagem/puc.png" alt="Logo PUC" class="logo-header" />
  </div>

  <div class="regiao-container">
    <div id="imagem-setor" class="regiao-imagem">
      <img src="imagem/drone.jpg" alt="Setor H4">
    </div>
  </div>

  <footer class="rodape">
    <p>v0.0.0.1</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const setor = params.get('setor');
    document.getElementById('titulo-setor').textContent = `Setor ${setor}`;
  </script>

</body>
</html>
