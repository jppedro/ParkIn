<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Vagas - ParkIn</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="visualizar-vagas.css?v=2">
</head>
<body>

  <div class="header estacionamento-header">
    <button class="voltar" onclick="window.location.href='estacionamento.html'">← Voltar</button>
    <img src="imagem/puc.png" alt="Logo PUC" class="logo-header">
  </div>

  <div class="parking-container">
    <h1 class="parking-title">Status do Estacionamento</h1>
    
    <div id="loading" class="loading">
      Carregando informações das vagas...
    </div>
    
    <div id="error" class="error" style="display: none;">
      Erro ao carregar dados. Verifique se o backend está rodando.
    </div>
    
    <div id="parking-content" style="display: none;">
      <div class="parking-info">
        <div class="info-card">
          <h3 id="total-spots">0</h3>
          <p>Total de Vagas</p>
        </div>
        <div class="info-card">
          <h3 id="free-spots">0</h3>
          <p>Vagas Livres</p>
        </div>
        <div class="info-card">
          <h3 id="occupied-spots">0</h3>
          <p>Vagas Ocupadas</p>
        </div>
        <div class="info-card">
          <h3 id="occupancy-rate">0%</h3>
          <p>Taxa de Ocupação</p>
        </div>
      </div>
      
      <div id="parking-image-container" class="parking-image-container">
        <img id="parking-image" class="parking-image" src="" alt="Imagem do Estacionamento" style="display: none;">
        <div id="parking-overlay" class="parking-overlay">
          <!-- Vagas serão sobrepostas aqui -->
        </div>
      </div>
      
      <div id="parking-grid" class="parking-grid" style="display: none;">
        <!-- Grid alternativo caso não haja imagem -->
      </div>
      
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color free"></div>
          <span style="color: #fff;">Vaga Livre</span>
        </div>
        <div class="legend-item">
          <div class="legend-color occupied"></div>
          <span style="color: #fff;">Vaga Ocupada</span>
        </div>
        <div class="legend-item">
          <div class="legend-color unknown"></div>
          <span style="color: #fff;">Status Desconhecido</span>
        </div>
      </div>
      
      <button class="refresh-btn" onclick="loadParkingData()">
        Atualizar Status
      </button>
      
      <div id="last-updated" class="last-updated">
        <!-- Última atualização será mostrada aqui -->
      </div>
    </div>
  </div>

  <footer class="rodape">
    <p>v0.0.0.1</p>
  </footer>

  <script>
    const API_BASE_URL = 'http://localhost:5001';
    
    // Obter parking_id da URL
    function getParkingIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('parking_id') || localStorage.getItem('current_parking_id');
    }
    
    // Função para carregar dados do estacionamento
    async function loadParkingData() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const contentEl = document.getElementById('parking-content');
      
      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      contentEl.style.display = 'none';
      
      // Obter parking_id
      const parkingId = getParkingIdFromURL();
      
      console.log('Parking ID:', parkingId);
      
      if (!parkingId) {
        showError('ID do estacionamento não encontrado. Volte e selecione uma área.');
        return;
      }
      
      try {
        // Carregar dados das vagas do parking específico
        const apiUrl = `${API_BASE_URL}/api/parking/status?parking_id=${parkingId}`;
        console.log('Fazendo request para:', apiUrl);
        
        const response = await fetch(apiUrl);
        
        console.log('Response status:', response.status);
        
        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Dados recebidos:', data);
        
        if (!data.success) {
          throw new Error(data.message || 'Erro ao carregar dados do estacionamento');
        }
        
        // Atualizar informações gerais
        const lastDetection = data.last_detection;
        
        if (lastDetection) {
          document.getElementById('total-spots').textContent = lastDetection.total_slots || 0;
          document.getElementById('free-spots').textContent = lastDetection.empty || 0;
          document.getElementById('occupied-spots').textContent = lastDetection.occupied || 0;
          document.getElementById('occupancy-rate').textContent = 
            lastDetection.occupancy_rate ? `${Math.round(lastDetection.occupancy_rate)}%` : '0%';
          
          // Atualizar timestamp
          if (lastDetection.timestamp) {
            const date = new Date(lastDetection.timestamp);
            document.getElementById('last-updated').textContent = 
              `Última atualização: ${date.toLocaleString('pt-BR')}`;
          }
          
          // Carregar imagem anotada
          await loadParkingImage(lastDetection.output_image, parkingId);
        } else {
          throw new Error('Nenhuma detecção disponível para esta área. Execute uma detecção primeiro.');
        }
        
        // Mostrar conteúdo
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        showError(error.message);
      }
    }
    
    // Função para exibir erro
    function showError(message) {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = `⚠️ ${message}`;
    }

    // Função para carregar a imagem do estacionamento
    async function loadParkingImage(imagePath, parkingId) {
      const imageEl = document.getElementById('parking-image');
      const imageContainerEl = document.getElementById('parking-image-container');
      
      console.log('Carregando imagem. Path:', imagePath, 'Parking ID:', parkingId);
      
      if (!imagePath) {
        imageContainerEl.style.display = 'none';
        return;
      }
      
      try {
        // Usar endpoint da API para servir a imagem
        const imageUrl = `${API_BASE_URL}/api/parking/image/${parkingId}?type=detection&timestamp=${Date.now()}`;
        console.log('URL da imagem:', imageUrl);
        
        return new Promise((resolve, reject) => {
          imageEl.onload = () => {
            console.log('Imagem carregada com sucesso!');
            imageEl.style.display = 'block';
            imageContainerEl.style.display = 'block';
            resolve();
          };
          
          imageEl.onerror = () => {
            console.error('Erro ao carregar imagem');
            imageContainerEl.style.display = 'none';
            reject(new Error('Imagem não encontrada'));
          };
          
          imageEl.src = imageUrl;
        });
        
      } catch (error) {
        console.error('Erro ao carregar imagem:', error.message);
        imageContainerEl.style.display = 'none';
      }
    }


    // Carregar dados quando a página carregar
    document.addEventListener('DOMContentLoaded', () => {
      loadParkingData();
      
      // Atualizar automaticamente a cada 30 segundos
      setInterval(loadParkingData, 30000);
    });
  </script>

</body>
</html>
