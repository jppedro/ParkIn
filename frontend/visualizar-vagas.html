<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Vagas - ParkIn</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="visualizar-vagas.css?v=2">
</head>
<body>

<div class="header estacionamento-header">
    <button class="voltar" onclick="window.location.href='estacionamento.html'">← Voltar</button>
    <img src="imagem/puc.png" alt="Logo PUC" class="logo-header">
</div>

<div class="parking-container">
    <h1 class="parking-title">Status do Estacionamento</h1>

    <div id="loading" class="loading">
        Carregando informações das vagas...
    </div>

    <div id="error" class="error" style="display: none;">
        Erro ao carregar dados. Verifique se o backend está rodando.
    </div>

    <div id="parking-content" style="display: none;">
        <div class="parking-info">
            <div class="info-card">
                <h3 id="total-spots">0</h3>
                <p>Total de Vagas</p>
            </div>
            <div class="info-card">
                <h3 id="free-spots">0</h3>
                <p>Vagas Livres</p>
            </div>
            <div class="info-card">
                <h3 id="occupied-spots">0</h3>
                <p>Vagas Ocupadas</p>
            </div>
            <div class="info-card">
                <h3 id="occupancy-rate">0%</h3>
                <p>Taxa de Ocupação</p>
            </div>
        </div>

        <div id="parking-map-background" class="parking-map-background" style="display: none;">
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color free"></div>
                <span style="color: #fff;">Vaga Livre</span>
            </div>
            <div class="legend-item">
                <div class="legend-color occupied"></div>
                <span style="color: #fff;">Vaga Ocupada</span>
            </div>
            <div class="legend-item">
                <div class="legend-color unknown"></div>
                <span style="color: #fff;">Status Desconhecido</span>
            </div>
        </div>

        <div id="last-updated" class="last-updated">
        </div>

        <!-- Status da detecção automática -->
        <div class="video-status-bar" style="margin-top: 20px; padding: 15px; background: #2b2b2b; border-radius: 12px; text-align: center;">
            <div id="video-status" style="color: #4CAF50; font-weight: bold; font-size: 16px;">
                🔴 Aguardando conexão...
            </div>
        </div>

        <!-- Vídeo oculto para extração de frames -->
        <video id="parking-video" style="display: none;" crossorigin="anonymous" muted loop></video>
        <canvas id="frame-canvas" style="display: none;"></canvas>
    </div>
</div>

<footer class="rodape">
    <p>v0.0.0.1</p>
</footer>

<script>
    const API_BASE_URL = 'http://localhost:5001';
    
    let videoElement = null;
    let canvasElement = null;
    let videoProcessingInterval = null;
    let isProcessingVideo = false;
    const FRAME_INTERVAL_SECONDS = 5; // Intervalo fixo de detecção 

    function getParkingIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('parking_id') || localStorage.getItem('current_parking_id');
    }

    async function loadParkingData() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const contentEl = document.getElementById('parking-content');
      const mapContainer = document.getElementById('parking-map-background');

      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      contentEl.style.display = 'none';
      mapContainer.style.display = 'none';

      const parkingId = getParkingIdFromURL();

      try {
        const apiUrl = `${API_BASE_URL}/api/parking/status?parking_id=${parkingId}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);

        const data = await response.json();
        console.log('Dados recebidos (com layout DINÂMICO):', data);

        if (!data.success) throw new Error(data.message || 'Erro ao carregar dados');

        const lastDetection = data.last_detection;
        const layoutGroups = data.layout_groups;

        if (lastDetection && layoutGroups && layoutGroups.length > 0) {
          document.getElementById('total-spots').textContent = lastDetection.total_slots || 0;
          document.getElementById('free-spots').textContent = lastDetection.empty || 0;
          document.getElementById('occupied-spots').textContent = lastDetection.occupied || 0;
          document.getElementById('occupancy-rate').textContent =
            lastDetection.occupancy_rate ? `${Math.round(lastDetection.occupancy_rate)}%` : '0%';

          if (lastDetection.timestamp) {
            const date = new Date(lastDetection.timestamp);
            document.getElementById('last-updated').textContent =
              `Última atualização: ${date.toLocaleString('pt-BR')}`;
          }

          renderSlotLayout(layoutGroups);
          mapContainer.style.display = 'flex';

        } else {
          let errorMsg = 'Nenhuma detecção disponível para esta área.';
          if (!layoutGroups || layoutGroups.length === 0) {
            errorMsg = 'Erro ao gerar layout dinâmico. Verifique o backend.';
          }
          throw new Error(errorMsg);
        }

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        showError(error.message);
      }
    }

    /**
     * FUNÇÃO ATUALIZADA: Renderiza dinamicamente E verifica a orientação
     */
    function renderSlotLayout(layoutGroups) {
      const layoutContainer = document.getElementById('parking-map-background');
      layoutContainer.innerHTML = '';

      if (!layoutGroups) return;

      console.log(`Renderizando ${layoutGroups.length} fileiras dinâmicas...`);

      layoutGroups.forEach((aisle, index) => {

        const aisleDiv = document.createElement('div');
        aisleDiv.className = 'parking-aisle';

        aisle.forEach(slot => {
          const box = document.createElement('div');
          box.className = 'spot-box';

          if (layoutGroups.length === 7 && index === 3) {
              box.classList.add('vertical');
          }

          const statusClass = slot.status === 'occupied' ? 'occupied' : 'free';
          box.classList.add(statusClass);
          box.textContent = slot.id;

          aisleDiv.appendChild(box);
        });

        layoutContainer.appendChild(aisleDiv);

        if (index < layoutGroups.length - 1) {
          const laneDiv = document.createElement('div');
          laneDiv.className = 'aisle-lane';

          if (layoutGroups.length === 7 && index === 3) {
             laneDiv.classList.add('central');
             laneDiv.innerHTML = `<span class="map-text text-pare">PARE</span>
                                  <span class="map-text text-devagar">DEVAGAR</span>`;
          }

          layoutContainer.appendChild(laneDiv);
        }
      });
    }

    function renderSlotGridFallback(slots) {
      const grid = document.getElementById('parking-map-background');
      grid.innerHTML = '';
      if (!slots) return;
      slots.forEach(slot => {
        const box = document.createElement('div');
        box.className = 'spot-box';
        const statusClass = slot.status === 'occupied' ? 'occupied' : 'free';
        box.classList.add(statusClass);
        box.textContent = slot.id;
        grid.appendChild(box);
      });
    }

    function showError(message) {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = `⚠️ ${message}`;
    }

    // ========== FUNÇÕES DE PROCESSAMENTO DE VÍDEO ==========
    
    async function startVideoDetection() {
      const parkingId = getParkingIdFromURL();
      if (!parkingId) {
        console.error('ID da área não encontrado');
        updateVideoStatus('Erro: ID da área não encontrado');
        return;
      }

      if (isProcessingVideo) {
        console.log('Processamento já está em andamento');
        return;
      }

      try {
        updateVideoStatus('Conectando à câmera...');

        // Inicializar elementos
        videoElement = document.getElementById('parking-video');
        canvasElement = document.getElementById('frame-canvas');

        // Carregar vídeo
        const videoUrl = `${API_BASE_URL}/api/parking/video/${parkingId}`;
        console.log('Carregando vídeo:', videoUrl);
        
        videoElement.src = videoUrl;
        videoElement.load();

        // Aguardar vídeo carregar
        await new Promise((resolve, reject) => {
          videoElement.onloadedmetadata = resolve;
          videoElement.onerror = () => reject(new Error('Erro ao carregar vídeo'));
        });

        console.log('Vídeo carregado:', {
          duration: videoElement.duration,
          width: videoElement.videoWidth,
          height: videoElement.videoHeight
        });

        // Canvas será redimensionado para 1280x720 em cada frame
        // (não precisa configurar aqui)

        // Iniciar reprodução (loop automático via atributo HTML)
        await videoElement.play();
        isProcessingVideo = true;

        updateVideoStatus('🟢 Câmera ativa - Monitoramento contínuo');

        // Processar primeiro frame imediatamente
        await processCurrentFrame();

        // Configurar intervalo de processamento
        videoProcessingInterval = setInterval(async () => {
          if (isProcessingVideo) {
            await processCurrentFrame();
          }
        }, FRAME_INTERVAL_SECONDS * 1000);

        console.log(`✅ Detecção automática iniciada (intervalo: ${FRAME_INTERVAL_SECONDS}s)`);

      } catch (error) {
        console.error('❌ Erro ao iniciar detecção:', error);
        updateVideoStatus('🔴 Erro ao conectar à câmera');
        
        // Tentar reconectar após 10 segundos
        setTimeout(() => {
          console.log('🔄 Tentando reconectar...');
          startVideoDetection();
        }, 10000);
      }
    }

    async function processCurrentFrame() {
      if (!videoElement || !canvasElement || !isProcessingVideo) return;

      const parkingId = getParkingIdFromURL();
      const currentTime = videoElement.currentTime;

      console.log(`⏱️ Processando frame no tempo ${currentTime.toFixed(1)}s`);

      try {
        // Redimensionar canvas para resolução padrão (mesma do vídeo de referência)
        const STANDARD_WIDTH = 1280;
        const STANDARD_HEIGHT = 720;
        
        canvasElement.width = STANDARD_WIDTH;
        canvasElement.height = STANDARD_HEIGHT;

        // Extrair frame atual e redimensionar
        const ctx = canvasElement.getContext('2d');
        ctx.drawImage(videoElement, 0, 0, STANDARD_WIDTH, STANDARD_HEIGHT);

        // Converter canvas para blob
        const blob = await new Promise(resolve => {
          canvasElement.toBlob(resolve, 'image/jpeg', 0.95);
        });

        // Criar FormData
        const formData = new FormData();
        formData.append('parking_id', parkingId);
        formData.append('image', blob, 'frame.jpg');

        // Enviar para API
        const response = await fetch(`${API_BASE_URL}/api/parking/detect`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }

        const data = await response.json();

        if (data.success) {
          console.log('✅ Detecção concluída:', {
            occupied: data.occupied,
            empty: data.empty,
            rate: data.occupancy_rate
          });

          // Atualizar UI com os novos dados
          await updateUIWithDetection(data);
          updateVideoStatus(`🟢 Última detecção: ${new Date().toLocaleTimeString()}`);
        } else {
          console.error('❌ Erro na detecção:', data.message);
        }

      } catch (error) {
        console.error('❌ Erro ao processar frame:', error);
        updateVideoStatus('🔴 Erro na detecção');
      }
    }

    async function updateUIWithDetection(data) {
      // Atualizar estatísticas
      document.getElementById('total-spots').textContent = data.total_slots || 0;
      document.getElementById('free-spots').textContent = data.empty || 0;
      document.getElementById('occupied-spots').textContent = data.occupied || 0;
      document.getElementById('occupancy-rate').textContent = 
        data.occupancy_rate ? `${Math.round(data.occupancy_rate)}%` : '0%';

      // Atualizar timestamp
      const date = new Date();
      document.getElementById('last-updated').textContent =
        `Última atualização: ${date.toLocaleString('pt-BR')}`;

      // Buscar status completo para atualizar o layout das vagas
      const parkingId = getParkingIdFromURL();
      try {
        const response = await fetch(`${API_BASE_URL}/api/parking/status?parking_id=${parkingId}`);
        if (response.ok) {
          const statusData = await response.json();
          if (statusData.success && statusData.layout_groups && statusData.layout_groups.length > 0) {
            renderSlotLayout(statusData.layout_groups);
          }
        }
      } catch (error) {
        console.error('Erro ao buscar layout atualizado:', error);
      }
    }


    function updateVideoStatus(message) {
      const statusEl = document.getElementById('video-status');
      if (statusEl) {
        statusEl.textContent = message;
      }
    }

    // ========== INICIALIZAÇÃO ==========

    document.addEventListener('DOMContentLoaded', async () => {
      console.log('Iniciando sistema de monitoramento');
      
      // Carregar dados iniciais da área
      await loadParkingData();

      // Aguardar 2 segundos para garantir que a UI está pronta
      setTimeout(() => {
        console.log('Iniciando detecção automática');
        startVideoDetection();
      }, 2000);
    });
</script>
</body>
</html>
