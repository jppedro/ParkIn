<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Aluno - PUC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h2>Olá, BEM-VINDO!</h2>
    <p>Que bom te ver aqui</p>
    <img src="imagem/puc.png" alt="Logo da PUC">
  </div>

  <div class="grid">
    <div class="card" onclick="window.location.href='estacionamento.html'">
      <img src="imagem/car.png" alt="Estacionamento">
      <p>Estacionamento</p>
    </div>
    <div class="card" onclick="abrirLink('https://teams.microsoft.com')">
      <img src="imagem/teams.png" alt="Microsoft Teams">
      <p>Microsoft Teams</p>
    </div>
    <div class="card" onclick="abrirLink('https://www.canvaslms.com')">
      <img src="imagem/canvas.png" alt="Canvas LMS">
      <p>Canvas</p>
    </div>
    <div class="card">
      <img src="imagem/list.png" alt="Aulas da Semana">
      <p>Aulas da Semana</p>
    </div>
    <div class="card">
      <img src="imagem/list.png" alt="Disciplinas">
      <p>Disciplinas</p>
    </div>
    <div class="card">
      <img src="imagem/area logada.png" alt="Área Logada">
      <p>Área Logada</p>
    </div>
    <div class="card">
      <img src="imagem/noticias.png" alt="Notícias PUC - Campinas">
      <p>Notícias PUC - Campinas</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
